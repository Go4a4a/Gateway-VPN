name: Gateway VPN CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-vpn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go, packaging and syntax gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: go.sum
      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l cmd internal migrations test)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Run race-enabled suite
        run: go test -race ./... -count=1
      - name: Run vet
        run: go vet ./...
      - name: Build all Linux release entrypoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gateway-vpn-ci"
          for name in gateway-vpn gateway-vpnctl gateway-vpn-bootstrap gateway-vpn-deploy; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/gateway-vpn-ci/$name" "./cmd/$name"
          done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/gateway-vpn-ci/gateway-vpn-deploy.exe" ./cmd/gateway-vpn-deploy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true -o "$RUNNER_TEMP/gateway-vpn-ci/gateway-vpn-endurance" ./test/endurance
      - name: Check JavaScript and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          non_executable=$(git ls-files --stage | awk '$1 != "100755" && $4 ~ /\.sh$/ { print $4 }')
          if [[ -n "$non_executable" ]]; then
            printf 'tracked shell entrypoints must use Git mode 100755:\n%s\n' "$non_executable" >&2
            exit 1
          fi
          node --check internal/webapi/static/app.js
          node --check internal/webapi/static/logging-ui.js
          node --check internal/webapi/static/wireguard-ingress.js
          node --check internal/webapi/static/contextual-help.js
          node --check internal/vpswebapi/static/app.js
          bash -n scripts/*.sh test/netns/*.sh test/systemd/*.sh test/release-gate/*.sh

  windows-deploy:
    name: Windows portable deploy contract
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: go.sum
      - name: Verify system Windows OpenSSH and portable launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ssh = 'C:\Windows\System32\OpenSSH\ssh.exe'
          if (-not (Test-Path -LiteralPath $ssh -PathType Leaf)) { throw 'system Windows OpenSSH Client is missing' }
          & $ssh -V
          go test ./cmd/gateway-vpn-deploy ./internal/deploy ./internal/distribution -count=1
          go build -trimpath -o "$env:RUNNER_TEMP\gateway-vpn-deploy.exe" ./cmd/gateway-vpn-deploy
          & "$env:RUNNER_TEMP\gateway-vpn-deploy.exe" --version

  netns:
    name: Linux nftables fail-closed gate
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: go.sum
      - name: Refresh Ubuntu package indexes
        run: sudo apt-get update
      - name: Install netns test dependencies
        run: sudo apt-get install --yes --no-install-recommends --no-upgrade iproute2 nftables procps iputils-ping wireguard-tools libcap2-bin
      - name: Build native Linux netns binary
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/gateway-vpn-netns ./cmd/gateway-vpn
          go test -c -o /tmp/gateway-vpn-dataplane-test ./internal/dataplane
          go test -c -o /tmp/gateway-vpn-app-test ./internal/app
          go test -c -o /tmp/gateway-vpn-wgingress-test ./internal/wgingress
          go test -c -o /tmp/gateway-vpn-networkapply-test ./internal/networkapply
          go test -c -o /tmp/gateway-vpn-updatenet-test ./internal/updatenet
          go test -c -o /tmp/gateway-vpn-gatewayfabric-test ./internal/gatewayfabric
          go build -trimpath -o /tmp/gateway-vpn-vps-agent ./cmd/gateway-vpn-vps-agent
      - name: Prove owned firewall recovery and no direct route
        run: sudo ./test/netns/firewall_guard.sh /tmp/gateway-vpn-netns /tmp/gateway-vpn-dataplane-test
      - name: Prove startup policy across boot and process boundaries
        run: sudo ./test/netns/startup_policy.sh /tmp/gateway-vpn-netns /tmp/gateway-vpn-app-test
      - name: Prove multi-port LAN bridge SSH and uplink isolation
        run: sudo ./test/netns/lan_bridge_ssh.sh /tmp/gateway-vpn-netns
      - name: Prove WireGuard ingress kernel lifecycle and handshake
        run: sudo ./test/netns/wireguard_ingress.sh /tmp/gateway-vpn-wgingress-test
      - name: Prove topology rollback and peer-scoped one-arm firewall
        run: sudo ./test/netns/topology_profiles.sh /tmp/gateway-vpn-netns /tmp/gateway-vpn-networkapply-test
      - name: Prove signed-update service routes through exact HiLink and Ethernet contexts
        run: sudo ./test/netns/update_service_routes.sh /tmp/gateway-vpn-dataplane-test /tmp/gateway-vpn-updatenet-test
      - name: Prove five exact Management Resource profiles and external return paths
        run: sudo ./test/netns/management_resources.sh /tmp/gateway-vpn-gatewayfabric-test
      - name: Prove VPS operations read-only ownership boundary
        run: sudo ./test/netns/vps_operations_boundary.sh /tmp/gateway-vpn-vps-agent
      - name: Verify Gateway and VPS systemd units on pinned Ubuntu 24.04
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            ubuntu@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517 \
            /workspace/test/systemd/verify_units.sh
