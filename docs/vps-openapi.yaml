openapi: 3.1.0
info:
  title: Gateway VPN VPS Hub API
  version: 1.0.0-dev
  description: |
    Отдельный restricted API lightweight VPS Agent. Он обслуживает только
    объекты Gateway VPN и не является общей панелью управления VPS. Все
    маршруты, кроме login и одноразового pairing completion, требуют
    VPS-specific session cookie; mutations дополнительно требуют CSRF.
    End-to-end relay хранит только публичную allocation/forwarding policy:
    inner WireGuard private key на VPS отсутствует.
servers:
  - url: https://127.0.0.1:9443
    description: Локальный listener VPS
  - url: https://10.80.0.1:9443
    description: Legacy/admin WireGuard listener
tags:
  - name: Auth
  - name: Pairing
  - name: Hub
  - name: Gateways
  - name: Administrators
  - name: Relays
  - name: Resources
  - name: Access
  - name: Watchdog
  - name: Logs
  - name: Diagnostics
  - name: Backup
  - name: Updates
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: loginVPSHub
      summary: Создать VPS-specific административную сессию
      security: []
      requestBody: {$ref: '#/components/requestBodies/Login'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutVPSHub
      summary: Отозвать текущую VPS Hub сессию
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/auth/session:
    get:
      tags: [Auth]
      operationId: getVPSHubSession
      summary: Получить сессию и ротированный CSRF token
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/auth/password:
    put:
      tags: [Auth]
      operationId: changeVPSHubPassword
      summary: Изменить собственный пароль и отозвать остальные сессии
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/PasswordChange'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/pairing/complete:
    post:
      tags: [Pairing]
      operationId: completeVPSPairing
      summary: Однократно завершить pairing по bounded invitation token
      description: Публичная cookie-сессия не нужна; авторизацией служит одноразовый token с expiry/attempt budget.
      security: []
      requestBody: {$ref: '#/components/requestBodies/PairingCompletion'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/overview:
    get:
      tags: [Hub]
      operationId: getVPSHubOverview
      summary: Получить secret-free состояние VPS Hub
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/pairing-invitations:
    get:
      tags: [Pairing]
      operationId: listVPSPairingInvitations
      summary: Перечислить приглашения без token digest
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
    post:
      tags: [Pairing]
      operationId: createVPSPairingInvitation
      summary: Создать одноразовое приглашение на 5 минут–24 часа
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/PairingInvitation'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/pairing-invitations/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      tags: [Pairing]
      operationId: rejectVPSPairingInvitation
      summary: Отозвать приглашение до использования
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/DestructiveConfirmation'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/gateways:
    get:
      tags: [Gateways]
      operationId: listVPSGateways
      summary: Перечислить paired Gateway без private keys
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/gateways/{id}/revoke:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      tags: [Gateways]
      operationId: revokeVPSGateway
      summary: Отозвать Gateway после password re-authentication и точной фразы
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/ReauthenticatedConfirmation'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/admins:
    get:
      tags: [Administrators]
      operationId: listVPSAdministrators
      summary: Перечислить external/managed administrators и trust mode
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
    post:
      tags: [Administrators]
      operationId: createVPSAdministrator
      summary: Создать external либо one-use managed administrator
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/AdminCreate'}
      responses: {'201': {$ref: '#/components/responses/AdminPeer'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/admins/{id}/config:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      tags: [Administrators]
      operationId: downloadVPSAdministratorConfig
      summary: Один раз выдать managed WireGuard config и удалить private key на VPS
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/AdminConfigDownload'}
      responses: {'200': {$ref: '#/components/responses/WireGuardConfig'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/admins/{id}/rotate:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      tags: [Administrators]
      operationId: rotateVPSAdministrator
      summary: Начать make-before-break rotation managed administrator
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/AdminRotation'}
      responses: {'201': {$ref: '#/components/responses/AdminPeer'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/admins/{id}/revoke:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      tags: [Administrators]
      operationId: revokeVPSAdministrator
      summary: Отозвать administrator после password re-authentication
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/ReauthenticatedConfirmation'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/admins/{id}/trust-mode:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      tags: [Administrators]
      operationId: updateVPSAdministratorTrustMode
      summary: Выбрать ROUTED_HUB либо END_TO_END_RELAY
      description: END_TO_END_RELAY допускается только для EXTERNAL key; VPS не получает inner private key.
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/AdminTrustMode'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/admin-relays:
    get:
      tags: [Relays]
      operationId: listVPSAdminRelays
      summary: Перечислить публичные relay allocations и явно сообщить private_keys_on_vps=false
      responses: {'200': {$ref: '#/components/responses/AdminRelayList'}, default: {$ref: '#/components/responses/Error'}}
    post:
      tags: [Relays]
      operationId: createVPSAdminRelay
      summary: Создать и включить allowlisted/rate-limited UDP relay к одному Gateway
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/AdminRelayCreate'}
      responses: {'201': {$ref: '#/components/responses/AdminRelay'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/admin-relays/{id}/enabled:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      tags: [Relays]
      operationId: setVPSAdminRelayEnabled
      summary: Включить или отключить relay с root reconciliation
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Enabled'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/admin-relays/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      tags: [Relays]
      operationId: deleteVPSAdminRelay
      summary: Удалить только заранее отключённый relay
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/DestructiveConfirmation'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/resources:
    get:
      tags: [Resources]
      operationId: listVPSResources
      summary: Перечислить typed local-resource publications
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
    post:
      tags: [Resources]
      operationId: createVPSResource
      summary: Создать allowlisted публикацию ресурса
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/resources/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      tags: [Resources]
      operationId: updateVPSResource
      summary: Изменить typed публикацию ресурса
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
    delete:
      tags: [Resources]
      operationId: deleteVPSResource
      summary: Удалить публикацию после явного подтверждения
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/DestructiveConfirmation'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/access-matrix:
    get:
      tags: [Access]
      operationId: getVPSAccessMatrix
      summary: Получить Gateway/admin/resource/ACL read model и generations
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/acl:
    post:
      tags: [Access]
      operationId: createVPSACLGrant
      summary: Разрешить конкретному administrator один resource/protocol/port range
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/acl/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      tags: [Access]
      operationId: deleteVPSACLGrant
      summary: Удалить ACL grant после явного подтверждения
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/DestructiveConfirmation'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/watchdog:
    get:
      tags: [Watchdog]
      operationId: getVPSHubWatchdog
      summary: Получить control-plane и root-owned fabric/relay status
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/hub/fabric/apply:
    post:
      tags: [Watchdog]
      operationId: applyVPSHubFabric
      summary: Запустить parameter-free root reconciliation
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/JSON'}, '202': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/vps/backup/status:
    get:
      tags: [Backup]
      operationId: getVPSBackupStatus
      summary: Получить role-specific backup/restore status без authorization token
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/vps/backup/download:
    post:
      tags: [Backup]
      operationId: downloadVPSBackup
      summary: Создать, проверить и скачать encrypted .gvpn-vps
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/VPSBackup'}
      responses: {'200': {$ref: '#/components/responses/VPSBackup'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/vps/restore/stage:
    post:
      tags: [Backup]
      operationId: stageVPSRestore
      summary: Загрузить и проверить encrypted .gvpn-vps без изменения live state
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/VPSRestoreUpload'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/vps/restore/apply:
    post:
      tags: [Backup]
      operationId: applyVPSRestore
      summary: Authorize durable same-VPS либо import-as-new root restore
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/VPSRestoreApply'}
      responses: {'202': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/vps/restore:
    delete:
      tags: [Backup]
      operationId: discardVPSRestore
      summary: Удалить verified staging без изменения live state
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/DestructiveConfirmation'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/vps/logs:
    get:
      tags: [Logs]
      operationId: getVPSOperationalLogs
      summary: Получить bounded объединение root-collected journald и security audit
      parameters:
        - {name: category, in: query, schema: {type: string, maxLength: 64, default: all}}
        - {name: search, in: query, schema: {type: string, maxLength: 128}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/vps/diagnostics/status:
    get:
      tags: [Diagnostics]
      operationId: getVPSDiagnosticStatus
      summary: Описать secret-free диагностический архив и свежесть root snapshot
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/vps/diagnostics/download:
    post:
      tags: [Diagnostics]
      operationId: downloadVPSDiagnostics
      summary: Собрать в памяти bounded ZIP без секретов и host mutation
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/VPSDiagnostics'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/vps/update/status:
    get:
      tags: [Updates]
      operationId: getVPSUpdateStatus
      summary: Получить current/staged/transaction state без privileged paths и digests
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/vps/update/stage:
    post:
      tags: [Updates]
      operationId: stageVPSUpdate
      summary: Загрузить и проверить signed pointer-compatible VPS release
      description: Изменение signed packaging/vps host contract отклоняется с UPDATE_REQUIRES_INSTALLER.
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/VPSUpdateUpload'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/vps/update/apply:
    post:
      tags: [Updates]
      operationId: applyVPSUpdate
      summary: После re-authentication запустить root-owned apply/health/rollback transaction
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/VPSUpdateApply'}
      responses: {'202': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/vps/update:
    delete:
      tags: [Updates]
      operationId: discardVPSUpdate
      summary: Удалить verified staged release без изменения live state
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/DestructiveConfirmation'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gateway_vpn_vps_session
      description: Secure, HttpOnly, SameSite=Strict VPS-specific opaque session token.
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 256}
    DestructiveConfirmation:
      name: X-Confirm-Destructive
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
  requestBodies:
    JSON:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/GenericObject'}
    Login:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Login'}
    PasswordChange:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PasswordChange'}
    PairingCompletion:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PairingCompletion'}
    PairingInvitation:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PairingInvitation'}
    ReauthenticatedConfirmation:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ReauthenticatedConfirmation'}
    AdminCreate:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminCreate'}
    AdminConfigDownload:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminConfigDownload'}
    AdminRotation:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminRotation'}
    AdminTrustMode:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminTrustMode'}
    AdminRelayCreate:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminRelayCreate'}
    Enabled:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Enabled'}
    VPSBackup:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VPSBackupRequest'}
    VPSRestoreUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [passphrase, backup]
            properties:
              passphrase: {type: string, minLength: 12, maxLength: 256, format: password}
              backup: {type: string, format: binary}
          encoding:
            passphrase: {contentType: text/plain}
            backup: {contentType: application/vnd.gateway-vpn.vps-backup}
    VPSRestoreApply:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VPSRestoreApply'}
    VPSUpdateUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [release]
            properties:
              release: {type: string, format: binary, description: Signed Gateway VPN VPS .tar.gz release}
          encoding:
            release: {contentType: application/gzip}
    VPSUpdateApply:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VPSUpdateApply'}
  responses:
    JSON:
      description: Успешный secret-free JSON response.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/GenericObject'}
    NoContent: {description: Операция завершена без response body.}
    Error:
      description: Redacted error envelope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AdminPeer:
      description: Secret-free administrator state.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminPeer'}
    AdminRelay:
      description: Public relay allocation; private key fields отсутствуют.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminRelay'}
    AdminRelayList:
      description: Relay allocations and fixed no-private-key invariant.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminRelayList'}
    WireGuardConfig:
      description: One-use managed WireGuard configuration.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/x-wireguard-profile:
          schema: {type: string, format: binary, writeOnly: true}
    VPSBackup:
      description: Encrypted role-separated VPS backup.
      headers:
        X-Backup-Role: {schema: {type: string, const: vps}}
        X-Content-SHA256: {schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      content:
        application/vnd.gateway-vpn.vps-backup:
          schema: {type: string, format: binary}
    VPSDiagnostics:
      description: Bounded secret-free VPS operational diagnostic archive.
      headers:
        X-Content-SHA256: {schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      content:
        application/zip:
          schema: {type: string, format: binary}
  schemas:
    GenericObject: {type: object, additionalProperties: true}
    Login:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        password: {type: string, minLength: 1, maxLength: 1024, format: password, writeOnly: true}
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password, password_confirmation]
      properties:
        current_password: {type: string, maxLength: 1024, format: password, writeOnly: true}
        new_password: {type: string, minLength: 12, maxLength: 1024, format: password, writeOnly: true}
        password_confirmation: {type: string, minLength: 12, maxLength: 1024, format: password, writeOnly: true}
    PairingCompletion:
      type: object
      additionalProperties: false
      required: [invitation_id, token, site_id, display_name, public_key]
      properties:
        invitation_id: {type: string, maxLength: 128}
        token: {type: string, minLength: 32, maxLength: 128, format: password, writeOnly: true}
        site_id: {type: string, maxLength: 128}
        display_name: {type: string, minLength: 1, maxLength: 128}
        public_key: {$ref: '#/components/schemas/WireGuardPublicKey'}
        webui_url: {type: string, maxLength: 512}
    PairingInvitation:
      type: object
      additionalProperties: false
      required: [gateway_name, endpoint, assigned_subnet]
      properties:
        gateway_name: {type: string, minLength: 1, maxLength: 128}
        endpoint: {type: string, minLength: 3, maxLength: 512}
