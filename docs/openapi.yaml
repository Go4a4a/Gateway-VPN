openapi: 3.1.0
info:
  title: Gateway VPN Management API
  version: 1.0.0-dev
  description: |
    Локальный HTTPS API Gateway VPN. Все маршруты, кроме login, требуют
    защищённую session cookie. Все изменяющие запросы дополнительно требуют
    session-bound CSRF header. Секреты никогда не возвращаются клиенту.
servers:
  - url: https://192.168.200.1:8443
    description: Transit LAN по умолчанию
  - url: https://10.80.0.2:8443
    description: WireGuard management
tags:
  - name: Auth
  - name: Gateway
  - name: Access
  - name: Uplinks
  - name: Modems
  - name: Subscriptions
  - name: Nodes
  - name: Paths
  - name: Targets
  - name: Matchers
  - name: Health
  - name: Operations
  - name: Logging
  - name: System
  - name: Traffic
  - name: Network
  - name: WireGuard
  - name: ManagementFabric
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Создать локальную административную сессию
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Login'
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Отозвать текущую сессию
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Получить текущую сессию и новый CSRF token
      responses:
        '200': {$ref: '#/components/responses/Session'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/password:
    put:
      tags: [Auth]
      operationId: changeOwnPassword
      summary: Изменить собственный пароль и отозвать другие сессии
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/PasswordChange'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/users:
    get:
      tags: [Auth]
      operationId: listUsers
      summary: Перечислить локальных администраторов без секретов
      responses:
        '200': {$ref: '#/components/responses/UserList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Auth]
      operationId: createUser
      summary: Создать локального администратора с временным паролем
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/UserCreate'}
      responses:
        '201': {$ref: '#/components/responses/User'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/users/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      tags: [Auth]
      operationId: updateUser
      summary: Переименовать, включить или отключить администратора
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/UserUpdate'}
      responses:
        '200': {$ref: '#/components/responses/User'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Auth]
      operationId: deleteDisabledUser
      summary: Удалить заранее отключённого администратора
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/DestructiveConfirmation'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/users/{id}/password:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      tags: [Auth]
      operationId: resetUserPassword
      summary: Сбросить чужой пароль и отозвать все сессии пользователя
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/PasswordReset'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      summary: Перечислить активные сессии
      responses:
        '200': {$ref: '#/components/responses/SessionList'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/sessions/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: Отозвать выбранную сессию
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/gateway/status:
    get:
      tags: [Gateway]
      operationId: getGatewayStatus
      summary: Текущее состояние fail-closed control plane
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/gateway/diagnostics:
    get:
      tags: [Gateway]
      operationId: describeDiagnostics
      summary: Описать возможности диагностического архива
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/access-methods:
    get:
      tags: [Access]
      operationId: listAccessMethods
      summary: Единый ordered list прямого доступа и подписок с активным методом
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/access-methods/priorities:
    put:
      tags: [Access]
      operationId: reorderAccessMethods
      summary: Атомарно изменить полный порядок включённых способов доступа
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/OrderedIDs'}
      responses: {'202': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/access-methods/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      tags: [Access]
      operationId: updateAccessMethod
      summary: Включить или отключить direct/subscription method
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'202': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/access-methods/direct-only:
    post:
      tags: [Access]
      operationId: enableTemporaryDirectOnly
      summary: До reboot исключить VPN из пользовательского ranking
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'202': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
    delete:
      tags: [Access]
      operationId: disableTemporaryDirectOnly
      summary: Отменить boot-scoped direct-only mode
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'202': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/settings/access-policy:
    get:
      tags: [Access]
      operationId: getAccessPolicy
      summary: Получить startup gate, service refresh и hysteresis policy
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
    put:
      tags: [Access]
      operationId: updateAccessPolicy
      summary: Обновить startup gate, service refresh и hysteresis policy
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'202': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/system/runtime-metrics:
    get:
      tags: [System]
      operationId: getRuntimeMetrics
      summary: Получить secret-free process metrics для endurance-наблюдения
      responses: {'200': {$ref: '#/components/responses/RuntimeMetrics'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/system/watchdog:
    get:
      tags: [System]
      operationId: getWatchdogStatus
      summary: Получить secret-free component health, recovery history и suppression state
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/system/power/capabilities:
    get:
      tags: [System]
      operationId: getPowerCapabilities
      summary: Получить reboot/shutdown и hardware-verified RTC power-cycle capabilities
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/system/reboot:
    post:
      tags: [System]
      operationId: rebootSystem
      summary: После password re-authentication и точного подтверждения перезагрузить Gateway
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/PowerAction'}
      responses: {'202': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/system/shutdown:
    post:
      tags: [System]
      operationId: shutdownSystem
      summary: После password re-authentication и точного подтверждения выключить Gateway
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/PowerAction'}
      responses: {'202': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/system/power-cycle:
    post:
      tags: [System]
      operationId: rtcPowerCycleSystem
      summary: Выключить Gateway и запланировать RTC wake только после аппаратного подтверждения wake-from-S5
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/RTCPowerAction'}
      responses: {'202': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/system/uninstall/impact:
    get:
      tags: [System]
      operationId: getUninstallImpact
      summary: Получить bounded impact report до остановки WebUI, SSH/SFTP и восстановления recorded host state
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/system/uninstall:
    post:
      tags: [System]
      operationId: uninstallGateway
      summary: После password re-authentication, impact acknowledgements и точной фразы передать удаление durable root guardian
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/UninstallAction'}
      responses: {'202': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/gateway/reconcile:
    post:
      tags: [Gateway]
      operationId: reconcileGateway
      summary: Запустить согласование desired и observed state
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'202': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}

  /api/v1/wireguard/status:
    get:
      tags: [WireGuard]
      operationId: getWireGuardStatus
      summary: Состояние management WireGuard и modem reachability
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric:
    get:
      tags: [ManagementFabric]
      operationId: getGatewayManagementFabric
      summary: Получить redacted many-to-many VPS/link/admin/resource/ACL read model и desired/applied host status
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/vps/priorities:
    put:
      tags: [ManagementFabric]
      operationId: reorderGatewayManagementVPS
      summary: Атомарно изменить приоритет всех включённых управляющих VPS
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/vps/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      tags: [ManagementFabric]
      operationId: updateGatewayManagementVPS
      summary: Переименовать, включить или отключить VPS с автоматическим bounded apply/retry
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/links/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      tags: [ManagementFabric]
      operationId: updateGatewayManagementLink
      summary: Изменить enabled/uplink policy/keepalive отдельной связи без передачи root-команд из WebUI
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/admin-contour:
    put:
      tags: [ManagementFabric]
      operationId: configureGatewayAdminContour
      summary: Создать, включить, отключить или перенумеровать fixed wg-admin; private identity генерирует только root broker
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/admin-contour/rotate:
    post:
      tags: [ManagementFabric]
      operationId: rotateGatewayAdminContourIdentity
      summary: После password re-authentication явно заменить root-owned wg-admin identity с rollback
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/admin-relays:
    post:
      tags: [ManagementFabric]
      operationId: createGatewayAdminRelay
      summary: Добавить bounded VPS UDP relay к одному management link
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/admin-relays/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      tags: [ManagementFabric]
      operationId: updateGatewayAdminRelay
      summary: Изменить allowlisted endpoint/port/rate или enabled одного relay
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
    delete:
      tags: [ManagementFabric]
      operationId: deleteGatewayAdminRelay
      summary: Удалить заранее отключённый relay без активных inner peers
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/admin-tunnels:
    post:
      tags: [ManagementFabric]
      operationId: createGatewayAdminTunnel
      summary: Импортировать public identity администратора как inner wg-admin peer и связать с relay
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/admin-tunnels/{id}/revoke:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      tags: [ManagementFabric]
      operationId: revokeGatewayAdminTunnel
      summary: Отозвать inner peer до удаления
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/admin-tunnels/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      tags: [ManagementFabric]
      operationId: deleteGatewayAdminTunnel
      summary: Удалить ранее отозванный inner peer
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/admins/{admin_id}/vps/{vps_id}/trust-mode:
    parameters:
      - $ref: '#/components/parameters/AdminID'
      - $ref: '#/components/parameters/VPSID'
    put:
      tags: [ManagementFabric]
      operationId: updateGatewayAdminTrustMode
      summary: Переключить ROUTED_HUB или END_TO_END_RELAY только при согласованном inner tunnel lifecycle
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/sync:
    post:
      tags: [ManagementFabric]
      operationId: syncGatewayManagementFabric
      summary: Попросить root broker перечитать SQLite/secrets и безопасно согласовать все VPS links/routes/ACL
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/resources:
    post:
      tags: [ManagementFabric]
      operationId: createGatewayManagementResource
      summary: Создать typed локальный ресурс; LOCAL_SUBNET требует проверочный host, а до fresh root probe ресурс не публикуется в host runtime
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/resources/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      tags: [ManagementFabric]
      operationId: updateGatewayManagementResource
      summary: Изменить typed resource, сбросить qualification и атомарно продвинуть route/ACL generation
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
    delete:
      tags: [ManagementFabric]
      operationId: deleteGatewayManagementResource
      summary: После отдельного подтверждения удалить отключённый ресурс и зависимые публикации/ACL
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/resources/{id}/probe:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      tags: [ManagementFabric]
      operationId: probeGatewayManagementResource
      summary: Передать root broker только resource ID; route/interface/transport и проверочный host подсети он повторно читает из typed SQLite state
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/publications:
    post:
      tags: [ManagementFabric]
      operationId: createGatewayResourcePublication
      summary: Выделить явный непересекающийся alias ресурса на выбранном management link
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/publications/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      tags: [ManagementFabric]
      operationId: updateGatewayResourcePublication
      summary: Изменить alias/link/enabled публикации с атомарным generation bump
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
    delete:
      tags: [ManagementFabric]
      operationId: deleteGatewayResourcePublication
      summary: После подтверждения удалить отключённую публикацию
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/acl:
    post:
      tags: [ManagementFabric]
      operationId: createGatewayResourceACL
      summary: Разрешить администратору только подмножество объявленных protocol/ports опубликованного ресурса
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/management-fabric/acl/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      tags: [ManagementFabric]
      operationId: updateGatewayResourceACL
      summary: Изменить bounded ACL и атомарно продвинуть generation затронутых links
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
    delete:
      tags: [ManagementFabric]
      operationId: deleteGatewayResourceACL
      summary: После подтверждения удалить отключённую ACL запись
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/settings/wireguard:
    get:
      tags: [WireGuard]
      operationId: getWireGuardSettings
      summary: Получить настройки без private key
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
    put:
      tags: [WireGuard]
      operationId: updateWireGuardSettings
      summary: Сохранить защищённые настройки и синхронизировать root runtime
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'202': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}

  /api/v1/wireguard-ingress:
    get:
      tags: [WireGuard]
      operationId: getWireGuardIngressServer
      summary: Получить настройки и runtime-состояние входящего WireGuard без private key
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
    put:
      tags: [WireGuard]
      operationId: updateWireGuardIngressServer
      summary: Безопасно применить настройки входящего WireGuard-сервера
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/wireguard-ingress/rotate:
    post:
      tags: [WireGuard]
      operationId: rotateWireGuardIngressServerKey
