# Gateway VPN is an IPv4 router between the Keenetic WAN and Mihomo TUN.
# The owned fail-closed nftables table remains the packet-level enforcement.
net.ipv4.ip_forward = 1
# Preserve each owned socket fwmark across conntrack responses so Ubuntu's
# rp_filter validates the reply against the same per-uplink routing table.
net.ipv4.conf.all.src_valid_mark = 1
