<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gateway VPN</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="login-view" class="login-shell" hidden>
    <form id="login-form" class="login-card">
      <div class="brand-mark">GV</div>
      <h1>Gateway VPN</h1>
      <p>Управление модемами, подписками и проверенными VPN-путями</p>
      <label>Пользователь<input name="username" autocomplete="username" value="admin" required></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Войти</button>
      <div id="login-notice" class="notice" role="status" hidden></div>
      <div id="login-error" class="error" role="alert"></div>
    </form>
  </section>

  <div id="app-view" class="app-shell" hidden>
    <aside>
      <div class="brand"><span class="brand-mark small">GV</span><span><strong>Gateway VPN</strong><small>Control plane</small></span></div>
      <label id="mobile-navigation" class="mobile-navigation" for="mobile-navigation-select">
        <span>Раздел WebUI</span>
        <select id="mobile-navigation-select">
          <optgroup label="Состояние">
            <option value="overview">Обзор</option>
            <option value="health">Состояние и события</option>
            <option value="traffic">Трафик</option>
          </optgroup>
          <optgroup label="Интернет и VPN">
            <option value="uplinks">Физические выходы</option>
            <option value="modems">Модемы</option>
            <option value="access">Способы доступа</option>
            <option value="subscriptions">Подписки</option>
            <option value="matrix">Матрица путей</option>
            <option value="targets">Серверы проверки</option>
            <option value="matchers">Правила отбора</option>
            <option value="nodes">VPN-серверы</option>
          </optgroup>
          <optgroup label="Туннели и управление">
            <option value="wireguard-ingress">WireGuard-клиенты</option>
            <option value="management-fabric">VPS и удалённое управление</option>
            <option value="remote">Legacy VPS-канал</option>
          </optgroup>
          <optgroup label="Gateway">
            <option value="network">Сеть</option>
            <option value="system">Система и безопасность</option>
          </optgroup>
        </select>
      </label>
      <nav id="navigation" aria-label="Разделы">
        <div class="nav-group">Состояние</div>
        <button data-tab="overview" class="active">Обзор</button>
        <button data-tab="health">Состояние и события</button>
        <button data-tab="traffic">Трафик</button>
        <div class="nav-group">Интернет и VPN</div>
        <button data-tab="uplinks">Физические выходы</button>
        <button data-tab="modems">Модемы</button>
        <button data-tab="access">Способы доступа</button>
        <button data-tab="subscriptions">Подписки</button>
        <button data-tab="matrix">Матрица путей</button>
        <button data-tab="targets">Серверы проверки</button>
        <button data-tab="matchers">Правила отбора</button>
        <button data-tab="nodes">VPN-серверы</button>
        <div class="nav-group">Туннели и управление</div>
        <button data-tab="wireguard-ingress">WireGuard-клиенты</button>
        <button data-tab="management-fabric">VPS и удалённое управление</button>
        <button data-tab="remote">Legacy VPS-канал</button>
        <div class="nav-group">Gateway</div>
        <button data-tab="network">Сеть</button>
        <button data-tab="system">Система и безопасность</button>
      </nav>
      <button id="logout" class="logout">Выйти</button>
    </aside>
    <main>
      <header><div><p class="eyebrow">GATEWAY CONTROL</p><h1 id="page-title">Обзор</h1></div><div id="gateway-badge" class="badge neutral">Загрузка</div></header>
      <div id="notice" class="notice" hidden></div>
      <section id="content" aria-live="polite"></section>
    </main>
  </div>
  <script src="/power.js" defer></script>
  <script src="/uninstall.js" defer></script>
  <script src="/wireguard-ingress.js" defer></script>
  <script src="/contextual-help.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/management-fabric.js" defer></script>
  <script src="/logging-ui.js" defer></script>
  <script src="/watchdog.js" defer></script>
  <script src="/ethernet-network.js" defer></script>
  <script src="/modem-recovery.js" defer></script>
</body>
</html>
